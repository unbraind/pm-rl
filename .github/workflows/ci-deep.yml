name: CI Deep

on:
  push:
    branches: [main]
  schedule:
    # Release runs at 03:23 and hourly :41; CodeQL Monday 05:37 UTC.
    - cron: '13 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep:
    name: deep (${{ matrix.node-version }}, ${{ matrix.package-manager }})
    runs-on: ${{ vars.PM_LOCAL_DEEP != 'off' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
        package-manager: [npm, bun]
    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
      PM_TEST_DOCKER: off
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - uses: oven-sh/setup-bun@v2.2.0
        if: runner.environment == 'github-hosted'
        with:
          bun-version: '1.3.14'
      - name: Report Bun runtime
        run: bun --version
      - run: npm ci
      - name: Strict tracker health
        run: ./node_modules/.bin/pm health --strict-exit --require-merge-drivers
      - name: One full release gate with isolated identity
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: |
          set -euo pipefail
          gate_home=$(mktemp -d)
          env HOME="$gate_home" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 "$PACKAGE_MANAGER" run release:check
      - name: Bun install and bunx smoke
        run: |
          bun install --no-save
          bunx --no-install pm --version
          bun --eval "await import('./dist/index.js')"

  docker:
    name: deep Docker (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
      PM_TEST_DOCKER: required
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Require Docker daemon and Compose
        run: |
          docker info
          docker compose version
      - run: npm run build
      - name: Real Compose bandit and LM lifecycle drills
        shell: bash
        run: |
          set -euo pipefail
          gate_home=$(mktemp -d)
          env HOME="$gate_home" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 node --test --test-concurrency=2 test/compose.test.ts test/lm-compose.test.ts
