name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.check-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        include:
          - node-version: 22
            package-manager: npm
            check-name: test (22)
          - node-version: 26
            package-manager: npm
            check-name: test (26)
          - node-version: 26
            package-manager: bun
            check-name: Bun release (26)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # Exact pin: setup-bun resolves floating versions via an
          # unauthenticated api.github.com tag listing, which GitHub-hosted
          # runners routinely get 503/rate-limited on (broke this repo's CI
          # 3 runs in a row). An exact version downloads directly instead.
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      - name: Run complete npm release gate with isolated identity
        if: ${{ matrix.package-manager == 'npm' }}
        shell: bash
        run: |
          set -euo pipefail
          gate_home=$(mktemp -d)
          env HOME="$gate_home" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 npm run release:check

      - name: Run complete Bun release gate with isolated identity
        if: ${{ matrix.package-manager == 'bun' }}
        shell: bash
        run: |
          set -euo pipefail
          gate_home=$(mktemp -d)
          env HOME="$gate_home" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 bun run release:check

      - name: Report uncovered branches after a release failure
        if: ${{ failure() }}
        shell: bash
        run: |
          if [[ -f coverage/lcov.info ]]; then
            awk '
              /^SF:/ { source = substr($0, 4); sub(/^.*\//, "", source) }
              /^BRDA:/ {
                split(substr($0, 6), branch, ",")
                if (branch[4] == "0" || branch[4] == "-")
                  print source ":" branch[1] ": uncovered branch " branch[2] "/" branch[3]
              }
            ' coverage/lcov.info
          fi

      - name: Verify Bun can install the package graph
        run: bun install --no-save
